[project]
name = "zeus-rfdiffusion-env"
version = "0.1.0"
requires-python = ">=3.9,<3.10"
dependencies = [
    "zeus-protein",
    "zeus-rfdiffusion",
    "zeus-se3-transformer",
    "torch==1.9.1+cu111",
    "dgl-cu111==0.6.1",
    # DGL links these CUDA 11 libraries dynamically; the old torch wheel
    # does not expose them under the library names that DGL requires.
    "nvidia-cuda-runtime-cu11==11.8.89",
    "nvidia-cublas-cu11==11.11.3.6",
    "nvidia-curand-cu11==10.3.0.86",
    "nvidia-cusparse-cu11==11.7.5.86",
    "numpy==1.26.4",
    "scipy==1.10.1",
    "e3nn==0.3.3",
    "hydra-core==1.3.2",
    "biopython==1.83",
    "pyrsistent==0.19.3",
    "opt-einsum==3.3.0",
]

[tool.uv]
package = false
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
required-environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.uv.sources]
zeus-protein = { path = "../..", editable = true }
zeus-rfdiffusion = { path = "../../runtimes/rfdiffusion", editable = true }
zeus-se3-transformer = { path = "../../third_party/se3_transformer", editable = true }
torch = { index = "pytorch-cu111" }

[[tool.uv.index]]
name = "pytorch-cu111"
url = "https://download.pytorch.org/whl/cu111"
explicit = true
