[project]
name = "zeus-refold-env"
version = "0.1.0"
requires-python = ">=3.10,<3.11"
dependencies = [
    "zeus-protein",
    "zeus-openfold",
    "zeus-protein-mpnn",
    "torch==2.4.1+cu118",
    "numpy==1.26.4",
    "scipy==1.10.1",
    "fair-esm==2.0.0",
    "omegaconf==2.3.0",
    "einops==0.6.1",
    "biopython==1.83",
    "dm-tree==0.1.8",
    "ml-collections==0.1.1",
    "tmtools==0.3.0",
]

[tool.uv]
package = false
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
required-environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.uv.sources]
zeus-protein = { path = "../..", editable = true }
zeus-openfold = { path = "../../third_party/openfold", editable = true }
zeus-protein-mpnn = { path = "../../third_party/protein_mpnn", editable = true }
torch = { index = "pytorch-cu118" }

[[tool.uv.index]]
name = "pytorch-cu118"
url = "https://download.pytorch.org/whl/cu118"
explicit = true
