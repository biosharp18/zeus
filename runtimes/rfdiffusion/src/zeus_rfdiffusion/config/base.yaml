# Base inference Configuration.

inference:
  input_pdb: null
  num_designs: 10
  design_startnum: 0
  ckpt_override_path: null
  symmetry: null
  recenter: True
  radius: 10.0
  anchor_radius: 10.0  # pivot for diffusion_mode=anchored. Scalar s -> P=[s,0,0]; list [x,y,z] -> P=[x,y,z] (use off-axis for polyhedral groups)
  model_only_neighbors: False
  output_prefix: samples/design
  output_format: pdb  # 'pdb' (legacy, 1-char chain IDs) or 'cif' (mmCIF, multi-char chain IDs)
  write_trajectory: True
  scaffold_guided: False
  model_runner: SelfConditioning
  cautious: True
  align_motif: True
  symmetric_self_cond: True
  diffusion_mode: whole_assembly  # 'whole_assembly' (default, init at origin), 'offset_symmetric' (rotate around pivot P = [radius,0,0], ASU pinned at origin), or 'anchored' (translate ASU to [anchor_radius,0,0], rotate around origin, recenter so ASU ends at origin)
  stable_cdist: False  # Force numerically stable cdist (slower but exact at large coordinate offsets)
  final_step: 1
  deterministic: False
  chain_symmetric_features: False
                        # Rebuild the per-residue features that stock RFdiffusion
                        # indexes by absolute position in the concatenated
                        # assembly -- the N/C-terminus one-hots and the omega/phi
                        # torsions -- once per chain instead. Without it only
                        # chain 0 has an N-terminus and only chain n-1 a
                        # C-terminus, so identical chains carry different
                        # features and restricted mode's ASU tiling is lossy.
                        # Turn it on for BOTH arms of a null-vs-restricted
                        # comparison. It changes which structures come out, so
                        # it is off by default: existing runs stay reproducible.
  seed: null            # base seed; design i uses seed + i. null keeps the legacy seed = i
  deterministic_cudnn: True   # only consulted when deterministic=True: pin cuDNN algo choice
  disable_tf32: False   # only consulted when deterministic=True. TF32 is reproducible on one
                        # GPU but not across GPU generations; turn off to compare Ampere+ with
                        # older cards, at roughly 2-3x the matmul cost
  trb_save_ckpt_path: null
  schedule_directory_path: null
  model_directory_path: null
  cyclic: False
  cyc_chains: 'a'

  # Drift experiment harness: dedicated noise channel + per-step trajectory log.
  noise_mode: 'off'             # 'off' (use global RNG, default), 'fresh' (independent dedicated RNG), 'record', 'replay'
  noise_path: null              # path for record (output) or replay (input)
  noise_seed: 0                 # seed for FreshNoise / RecordingNoise
  noise_reseed_per_design: False  # rewind the noise stream to noise_seed + design_index at the
                                  # start of every design. Required for a design to be
                                  # reproducible on its own; changes which structures come out
  trajectory_log_path: null     # if set, save per-step (t, x_t, x_t_minus_1, px0, plddt[, msa/pair/state]) to .pt
  log_representations: False    # include msa_prev/pair_prev/state_prev in trajectory log (large)

contigmap:
  contigs: null
  inpaint_seq: null
  inpaint_str: null
  inpaint_str_helix: null
  inpaint_str_strand: null
  inpaint_str_loop: null
  provide_seq: null
  length: null

model:
  n_extra_block: 4
  n_main_block: 32
  n_ref_block: 4
  d_msa: 256
  d_msa_full: 64
  d_pair: 128
  d_templ: 64
  n_head_msa: 8
  n_head_pair: 4
  n_head_templ: 4
  d_hidden: 32
  d_hidden_templ: 32
  p_drop: 0.15
  SE3_param_full:
    num_layers: 1
    num_channels: 32
    num_degrees: 2
    n_heads: 4
    div: 4
    l0_in_features: 8
    l0_out_features: 8
    l1_in_features: 3
    l1_out_features: 2
    num_edge_features: 32
  SE3_param_topk:
    num_layers: 1
    num_channels: 32
    num_degrees: 2
    n_heads: 4
    div: 4
    l0_in_features: 64
    l0_out_features: 64
    l1_in_features: 3
    l1_out_features: 2
    num_edge_features: 64
  freeze_track_motif: False
  use_motif_timestep: False
  symmetry_mode: null

diffuser:
  T: 50
  b_0: 1e-2
  b_T: 7e-2
  schedule_type: linear
  so3_type: igso3
  crd_scale: 0.25
  partial_T: null    
  so3_schedule_type: linear
  min_b: 1.5
  max_b: 2.5
  min_sigma: 0.02
  max_sigma: 1.5

denoiser:
  noise_scale_ca: 1
  final_noise_scale_ca: 1
  ca_noise_schedule_type: constant
  noise_scale_frame: 1
  final_noise_scale_frame: 1
  frame_noise_schedule_type: constant

ppi:
  hotspot_res: null

potentials:
  guiding_potentials: null 
  guide_scale: 10
  guide_decay: constant
  olig_inter_all : null
  olig_intra_all : null
  olig_custom_contact : null
  substrate: null

contig_settings:
  ref_idx: null
  hal_idx: null
  idx_rf: null
  inpaint_seq_tensor: null

preprocess:
  sidechain_input: False
  motif_sidechain_input: True
  d_t1d: 22
  d_t2d: 44
  prob_self_cond: 0.0
  str_self_cond: False
  predict_previous: False
  
logging:
  inputs: False

scaffoldguided:
  scaffoldguided: False
  target_pdb: False
  target_path: null
  scaffold_list: null
  scaffold_dir: null
  sampled_insertion: 0
  sampled_N: 0
  sampled_C: 0
  ss_mask: 0
  systematic: False
  target_ss: null
  target_adj: null
  mask_loops: True
  contig_crop: null
